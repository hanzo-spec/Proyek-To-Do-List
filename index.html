<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List</title>
  <style>
    /* CSS: Untuk mempercantik tampilan */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 { text-align: center; color: #333; }
    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
    ul { list-style: none; padding: 0; }
    li {
      background: #eee;
      margin-bottom: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 4px;
    }
    .btn-hapus {
      background-color: #dc3545;
      padding: 4px 8px;
      font-size: 12px;
    }
    .btn-hapus:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <!-- HTML: Struktur Utama Tampilan -->
  <div class="container">
    <h2>Daftar Tugas</h2>
    <div class="input-box">
      <input type="text" id="tugasInput" placeholder="Masukkan tugas baru...">
      <button onclick="tambahTugas()">Tambah</button>
    </div>
    <ul id="daftarTugas"></ul>
  </div>

  <!-- JAVASCRIPT: Logika Pemrograman -->
  <script>
    function tambahTugas() {
      const input = document.getElementById("tugasInput");
      const teksTugas = input.value.trim();

      if (teksTugas === "") {
        alert("Tugas tidak boleh kosong!");
        return;
      }

      const ul = document.getElementById("daftarTugas");
      const li = document.createElement("li");

      li.innerHTML = `
        <span>${teksTugas}</span>
        <button class="btn-hapus" onclick="hapusTugas(this)">Hapus</button>
      `;

      ul.appendChild(li);
      input.value = ""; // Kosongkan kolom input setelah ditambah
    }

    function hapusTugas(tombol) {
      const li = tombol.parentElement;
      li.remove();
    }
  </script>

</body>
</html>
